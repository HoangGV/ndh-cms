<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý tài khoản - NDH Blog CMS</title>
  <meta name="description" content="Trang viết bài trên Người đồng hành">
  <link rel="icon" type="image/webp" href="/src/icon-ndh-cms.webp">
  <link rel="apple-touch-icon" href="/src/icon-ndh-cms.webp">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Người đồng hành">
  <meta property="og:title" content="Quản lý tài khoản - NDH Blog CMS">
  <meta property="og:description" content="Trang viết bài trên Người đồng hành">
  <meta property="og:image" content="/src/ndh-cms.webp">
  <link rel="stylesheet" href="style.css?v=1">
  <script>
    const savedTheme = localStorage.getItem('cms_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">← Quay lại trang chủ CMS</a>
  <div class="nav-actions">
    <button type="button" class="btn btn-outline btn-sm" id="theme-toggle">🌓 Giao diện</button>
    <a href="guide.html" class="btn btn-outline btn-sm">Hướng dẫn</a>
    <span class="badge badge-role" id="user-badge">...</span>
    <button type="button" class="btn btn-outline btn-sm" id="btn-logout">Đăng xuất</button>
  </div>
</header>

<main class="container">
  <div id="alert-box"></div>

  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
    <div class="card">
      <h2 style="margin-bottom: 16px;">Thông tin cá nhân</h2>
      <form id="profile-form">
        <div class="form-group">
          <label>Họ và tên hiển thị</label>
          <input type="text" id="prof-fullname" required>
        </div>
        <div class="form-group">
          <label>Tên đăng nhập (Username)</label>
          <input type="text" id="prof-username" required>
        </div>
        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 16px;">Đổi mật khẩu</h2>
      <form id="password-form">
        <div class="form-group">
          <label>Mật khẩu hiện tại</label>
          <input type="password" id="pass-current" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu mới (tối thiểu 6 ký tự)</label>
          <input type="password" id="pass-new" required>
        </div>
        <div class="form-group">
          <label>Nhập lại mật khẩu mới</label>
          <input type="password" id="pass-confirm" required>
        </div>
        <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
      </form>
    </div>
  </div>

  <div id="admin-users-card" class="card" style="display:none;">
    <h2 style="margin-bottom: 16px;">Quản lý tài khoản & Phân quyền Admin</h2>
    <div class="table-wrap">
      <table class="responsive-table">
        <thead>
          <tr>
            <th>Họ và tên</th>
            <th>Tên đăng nhập</th>
            <th>Vai trò</th>
            <th>Ngày tham gia</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('cms_theme', next);
  });

  function esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showAlert(msg, isError = false) {
    document.getElementById('alert-box').innerHTML = `<div class="alert ${isError ? 'alert-error' : 'alert-success'}">${esc(msg)}</div>`;
  }

  let currentUser = null;

  async function initAccount() {
    const res = await fetch('/api/me');
    if (!res.ok) {
      window.location.href = 'index.html';
      return;
    }
    const data = await res.json();
    currentUser = data.user;
    document.getElementById('user-badge').textContent = `${currentUser.full_name} (${currentUser.role.toUpperCase()})`;
    document.getElementById('prof-fullname').value = currentUser.full_name;
    document.getElementById('prof-username').value = currentUser.username;

    if (currentUser.role === 'admin') {
      document.getElementById('admin-users-card').style.display = 'block';
      await loadUsers();
    }
  }

  async function loadUsers() {
    const res = await fetch('/api/users');
    const data = await res.json();
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = (data.users || []).map(u => `
      <tr>
        <td data-label=""><strong>${esc(u.full_name)}</strong> ${u.id === currentUser.id ? '<small>(Bạn)</small>' : ''}</td>
        <td data-label="Username:">@${esc(u.username)}</td>
        <td data-label="Vai trò:"><span class="badge badge-role">${esc(u.role.toUpperCase())}</span></td>
        <td data-label="Tham gia:"><small>${esc(u.created_at)}</small></td>
        <td data-label="">
          ${u.role === 'member'
            ? `<button type="button" class="btn btn-primary btn-sm" onclick="promoteUser(${u.id}, '${esc(u.full_name)}')">Phong làm Admin</button>`
            : `<small style="color:var(--text-muted);">Quản trị viên</small>`}
        </td>
      </tr>
    `).join('');
  }

  async function promoteUser(userId, fullName) {
    if (!confirm(`Phong tài khoản "${fullName}" làm Admin? Người này sẽ có toàn quyền quản trị bài viết.`)) return;
    const res = await fetch('/api/users/promote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      showAlert(data.error || 'Lỗi phân quyền.', true);
      return;
    }
    showAlert(`Đã phong tài khoản "${fullName}" làm Admin!`, false);
    await loadUsers();
  }

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/account/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: document.getElementById('prof-fullname').value,
        username: document.getElementById('prof-username').value
      })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      showAlert(data.error || 'Cập nhật thất bại.', true);
      return;
    }
    currentUser = data.user;
    document.getElementById('user-badge').textContent = `${currentUser.full_name} (${currentUser.role.toUpperCase()})`;
    showAlert('Đã cập nhật thông tin tài khoản thành công!', false);
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPass = document.getElementById('pass-new').value;
    const confirmPass = document.getElementById('pass-confirm').value;
    if (newPass !== confirmPass) {
      showAlert('Mật khẩu mới xác nhận không khớp.', true);
      return;
    }
    const res = await fetch('/api/account/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        current_password: document.getElementById('pass-current').value,
        new_password: newPass
      })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      showAlert(data.error || 'Đổi mật khẩu thất bại.', true);
      return;
    }
    e.target.reset();
    showAlert('Đã đổi mật khẩu thành công!', false);
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = 'index.html';
  });

  initAccount();
</script>
</body>
</html>
